openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /marketing/access/blueprint:
    get:
      operationId: getMarketingBlueprint
      tags: [marketing]
      description: Private read-only presentation for the session's personal project invitation. Requires the initial PIN change. Never returns drafts, attachments, contacts or money.
      parameters:
        - { name: invite, in: query, required: true, schema: { type: string } }
        - { name: X-Marketing-Session, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current confirmed layout, or EMPTY when none has been confirmed
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingBlueprint" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}/blueprint:
    get:
      operationId: getProjectBlueprint
      tags: [workspace]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized layout; partners receive confirmed geometry only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBlueprint" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}/blueprint/generate:
    post:
      operationId: generateProjectLayout
      tags: [workspace]
      description: Save a schematic draft from live inventory and saved setup. No upload or billed AI is required. Existing confirmed geometry is preserved.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateLayoutRequest" }
      responses:
        "200":
          description: Saved project-generated draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBlueprint" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}/blueprint/save:
    post:
      operationId: saveProjectBlueprint
      tags: [workspace]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveBlueprintRequest" }
      responses:
        "200":
          description: Saved draft or reviewed presentation version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectBlueprint" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}/documents:
    get:
      operationId: getProjectDocuments
      tags: [workspace]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active project documents, excluding unrelated payment attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDocuments" }
        default: { $ref: "#/components/responses/ApiFailure" }
    post:
      operationId: saveProjectDocuments
      tags: [workspace]
      description: Atomically synchronize document associations only. Removed records are soft-deleted; private files and financial or historical references are retained.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDocumentsRequest" }
      responses:
        "200":
          description: Current documents and project revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDocuments" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /notifications:
    get:
      operationId: getProjectNotifications
      tags: [workspace]
      description: Project activity visible only through current active firm/project membership. No approvals are required.
      responses:
        "200":
          description: Latest authorized activity and unread count
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  unread: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, projectId, title, message, createdAt, read]
                      properties:
                        id: { type: string, format: uuid }
                        projectId: { type: string, format: uuid }
                        title: { type: string }
                        message: { type: string }
                        createdAt: { type: string }
                        read: { type: boolean }
        default: { $ref: "#/components/responses/ApiFailure" }
  /notifications/{notificationId}/read:
    post:
      operationId: markProjectNotificationRead
      tags: [workspace]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Marked read for this authenticated identity }
        default: { $ref: "#/components/responses/ApiFailure" }
  /configuration/masters:
    get:
      operationId: getBusinessMasters
      tags: [workspace]
      description: Authenticated database-backed business choices and policy metadata. Owners also see disabled entries. Security permissions remain sector-release grants.
      responses:
        "200":
          description: Consistent master catalog snapshot
          content:
            application/json:
              schema:
                type: object
                required: [revision, items]
                properties:
                  revision: { type: integer, format: int64 }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BusinessMaster" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}/attachments:
    post:
      operationId: uploadProjectAttachment
      tags: [workspace]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Private project attachment metadata
          content:
            application/json:
              schema:
                type: object
                required: [id, fileName, contentType, size]
                properties:
                  id: { type: string }
                  fileName: { type: string }
                  contentType: { type: string }
                  size: { type: integer }
        default: { $ref: "#/components/responses/ApiFailure" }
  /erp/{projectId}:
    get:
      operationId: getProjectErp
      tags: [workspace]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized project ERP records, configured forms and calculated balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectErp" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /auth/company:
    post:
      operationId: resolveCompany
      tags: [auth]
      description: Resolve an active company code to its public firm name only. No identity or membership data is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyLookupInput" }
      responses:
        "200":
          description: Active company branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyLookupResult" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Authenticated session; a required credential change still blocks business access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current server-validated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAccount" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /auth/credential:
    post:
      operationId: changeCredential
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "200":
          description: New session; every previous session is revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      responses:
        "200":
          description: Authorised live workspace only; never demonstration data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /commands/{action}:
    post:
      operationId: executeCommand
      tags: [workspace]
      description: |
        Trusted commands only. OWNER: firm.create, firm.update, firm.assignSector,
        credentials.reset, sector.create, configuration.save, configuration.validate,
        configuration.publish. ACCOUNTANT: project.create, project.update, partner.add.
        All identities, roles, tenancy and permissions are derived on the server.
        project.setup-create atomically validates and saves the entire project setup,
        creates project-linked operational records and finalizes it. A failed create
        leaves no draft. Use project.setup-save and project.setup-finalize for resumable drafts.
        master.save is owner-only and requires revision when updating an existing choice.
        partner.update and partner.status are accountant-only, require project membership
        revision and affect only that project, never another firm's identity name.
        erp.save posts valid financial entries immediately; erp.review is disabled.
        erp.refer-back takes projectId, recordId, revision, requestId and a required reason.
        It appends a balanced reversal and returns the original record for correction,
        or refers an unposted historical record without moving money.
        erp.resubmit takes projectId, recordId, revision, requestId and corrected data.
        Only the original author may resubmit. It creates a new posted replacement;
        original entries and reversals remain immutable. Failed corrections roll back.
        Project statement entries expose postingState, revision, canReferBack,
        canResubmit, correctionReason, correctionFields and correctionData. Approver
        names and approval status are not part of the statement contract.
      parameters:
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandInput" }
      responses:
        "200":
          description: Atomic command result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /configuration/{releaseId}:
    get:
      operationId: getConfiguration
      tags: [configuration]
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Owner-only draft or published configuration preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectorConfiguration" }
        default: { $ref: "#/components/responses/ApiFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Read-only SOS database readiness check
      responses:
        "200":
          description: Database target, schema and owner are configured and business access is enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessStatus" }
        "503":
          description: Foundation setup or database connectivity is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
components:
  responses:
    ApiFailure:
      description: Explicit authentication, validation, conflict, permission or setup failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    GenerateLayoutRequest:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 0 }
    SaveBlueprintRequest:
      type: object
      required: [revision, geometry, confirm, reviewAcknowledged]
      properties:
        revision: { type: integer, minimum: 0 }
        attachmentId: { type: [string, "null"], format: uuid }
        geometry: { $ref: "#/components/schemas/LayoutGeometry" }
        confirm: { type: boolean }
        reviewAcknowledged: { type: boolean }
    SaveDocumentsRequest:
      type: object
      required: [revision, documents]
      properties:
        revision: { type: integer, minimum: 0 }
        documents:
          type: array
          maxItems: 100
          items:
            type: object
            required: [title, category, attachmentId]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              category: { type: string }
              attachmentId: { type: string, format: uuid }
    LayoutGeometry:
      type: object
      description: Versioned normalized 0..100 visual geometry. Parks, optional boundary, dimensional provenance and stable live plot IDs are persisted without changing inventory.
      additionalProperties: true
    MarketingBlueprint:
      type: object
      additionalProperties: false
      required: [status, plots]
      properties:
        status: { type: string, enum: [EMPTY, CONFIRMED] }
        confirmed:
          description: Absent or null when no layout has been confirmed.
          oneOf:
            - { $ref: "#/components/schemas/MarketingLayoutGeometry" }
            - { type: "null" }
        plots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [plotNumber, status]
            properties:
              plotNumber: { type: string }
              status: { type: string, enum: [available, reserved, blocked, sold] }
    MarketingLayoutGeometry:
      type: object
      additionalProperties: false
      required: [plots, roads, parks, northDegrees]
      properties:
        northDegrees: { type: [number, "null"] }
        aspectRatio: { type: number }
        scale:
          type: object
          additionalProperties: false
          required: [widthFeet, heightFeet, provenance]
          properties:
            widthFeet: { type: number }
            heightFeet: { type: number }
            provenance: { type: string, enum: [schematic, user-entered] }
        boundary:
          type: object
          additionalProperties: false
          required: [points]
          properties:
            points: { $ref: "#/components/schemas/MarketingLayoutPoints" }
        plots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, facing, points, referenceOnly]
            properties:
              number: { type: string }
              facing: { type: string, enum: [E, N, W, S, NE, NW, SE, SW, UNKNOWN] }
              referenceOnly: { type: boolean }
              points: { $ref: "#/components/schemas/MarketingLayoutPoints" }
        roads:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, points, widthFeet]
            properties:
              name: { type: string }
              widthFeet: { type: [number, "null"] }
              points: { $ref: "#/components/schemas/MarketingLayoutPoints" }
        parks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, points]
            properties:
              name: { type: string }
              points: { $ref: "#/components/schemas/MarketingLayoutPoints" }
    MarketingLayoutPoints:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [x, y]
        properties:
          x: { type: number }
          y: { type: number }
    ProjectBlueprint:
      type: object
      required: [revision, status, canManage, attachments, needsReconciliation, inventoryFingerprint]
      properties:
        revision: { type: integer }
        status: { type: string, enum: [EMPTY, DRAFT, CONFIRMED] }
        sourceAttachmentId: { type: [string, "null"] }
        confirmedAttachmentId: { type: [string, "null"] }
        draft: { oneOf: [ { $ref: "#/components/schemas/LayoutGeometry" }, { type: "null" } ] }
        confirmed: { oneOf: [ { $ref: "#/components/schemas/LayoutGeometry" }, { type: "null" } ] }
        canManage: { type: boolean }
        inventoryFingerprint: { type: string }
        needsReconciliation: { type: boolean }
        warnings: { type: array, items: { type: string } }
        attachments:
          type: array
          items:
            type: object
            required: [id, fileName, contentType]
            properties:
              id: { type: string }
              fileName: { type: string }
              contentType: { type: string }
    ProjectDocument:
      type: object
      required: [id, title, category, attachmentId, fileName, contentType, size]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        attachmentId: { type: string, format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        size: { type: integer }
    ProjectDocuments:
      type: object
      required: [revision, documents, canManage, categories]
      properties:
        revision: { type: integer }
        documents: { type: array, items: { $ref: "#/components/schemas/ProjectDocument" } }
        canManage: { type: boolean }
        categories:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    ErpRecord:
      type: object
      required: [id, kind, revision, status, createdBy, createdAt, data]
      properties:
        id: { type: string }
        kind: { type: string }
        revision: { type: integer }
        status: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        data: { type: object, additionalProperties: {} }
    ErpField:
      type: object
      required: [key, label, kind, required]
      properties:
        default: {}
        unit: { type: string }
        integer: { type: boolean }
        maxLength: { type: integer }
        visibleWhen: { type: object, additionalProperties: true }
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [text, number, date, select, boolean, account, partner, inventory, multiline] }
        required: { type: boolean }
        min: { type: number }
        max: { type: number }
        options: { type: array, items: { type: string } }
    ErpResource:
      type: object
      required: [kind, title, fields, canCreate, canManage, canReview]
      properties:
        kind: { type: string }
        title: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/ErpField" } }
        canCreate: { type: boolean }
        canManage: { type: boolean }
        canReview: { type: boolean }
        canReviewOwn: { type: boolean }
    FinancialStatementEntry:
      type: object
      required: [id, date, type, amount, postingState, revision, kind, canReferBack, canResubmit, correctionFields, correctionData, accountId, accountName, affectsCash, description]
      properties:
        id: { type: string }
        date: { type: string }
        type: { type: string, enum: [credit, debit] }
        amount: { type: string }
        postingState: { type: string, enum: [posted, legacy_unposted, referred_back, superseded, reversal, rejected] }
        revision: { type: integer }
        kind: { type: string }
        canReferBack: { type: boolean }
        canResubmit: { type: boolean }
        correctionReason: { type: string }
        correctionFields: { type: array, items: { $ref: "#/components/schemas/ErpField" } }
        correctionData: { type: object, additionalProperties: {} }
        accountId: { type: string }
        accountName: { type: string }
        description: { type: string }
        category: { type: string }
        categoryLabel: { type: string }
        partnerName: { type: string }
        paymentMode: { type: string }
        affectsCash: { type: boolean }
    ProjectErp:
      type: object
      required: [projectId, records, resources, balances, partners, audit, settings]
      properties:
        reviewableRecordIds: { type: array, items: { type: string } }
        statement:
          type: array
          items: { $ref: "#/components/schemas/FinancialStatementEntry" }
        projectSetup: { type: object, additionalProperties: true }
        projectId: { type: string }
        records: { type: array, items: { $ref: "#/components/schemas/ErpRecord" } }
        resources: { type: array, items: { $ref: "#/components/schemas/ErpResource" } }
        balances:
          type: array
          items:
            type: object
            required: [accountId, balance]
            properties:
              accountId: { type: string }
              balance: { type: string }
        partners:
          type: array
          items:
            type: object
            required: [id, name, mobile, invested, drawings, expenses, equityPercent]
            properties:
              id: { type: string }
              name: { type: string }
              mobile: { type: string }
              invested: { type: string }
              drawings: { type: string }
              expenses: { type: string }
              equityPercent: { type: string }
        audit:
          type: array
          items:
            type: object
            required: [id, actor, event, timestamp]
            properties:
              id: { type: string }
              actor: { type: string }
              event: { type: string }
              timestamp: { type: string }
        settings: { type: object, additionalProperties: {} }
    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    LoginInput:
      type: object
      required: [role, mobile, credential]
      properties:
        role:
          type: string
          enum: [OWNER, CLIENT, ACCOUNTANT, PARTNER]
          description: CLIENT resolves accountant or partner membership within the supplied company code. OWNER is used only by the separate owner portal.
        mobile: { type: string, maxLength: 24 }
        credential:
          type: string
          minLength: 1
          maxLength: 72
          description: Six-digit client PIN or owner password. Legacy client credentials are accepted only to enter mandatory PIN conversion.
        clientCode: { type: string, maxLength: 32 }
    CredentialInput:
      type: object
      required: [currentCredential, newCredential]
      properties:
        currentCredential: { type: string, maxLength: 72 }
        newCredential:
          type: string
          minLength: 6
          maxLength: 72
          description: Exactly six ASCII digits for accountant/partner; at least eight characters for OWNER. Validated by the server role.
    CompanyLookupInput:
      type: object
      required: [clientCode]
      properties:
        clientCode: { type: string, minLength: 1, maxLength: 32 }
    CompanyLookupResult:
      type: object
      required: [clientCode, name]
      properties:
        clientCode: { type: string }
        name: { type: string }
    SessionAccount:
      type: object
      required: [identityId, role, displayName, mobile, mustChangeCredential]
      properties:
        identityId: { type: string, format: uuid }
        role: { type: string, enum: [OWNER, ACCOUNTANT, PARTNER] }
        displayName: { type: string }
        mobile: { type: string }
        mustChangeCredential: { type: boolean }
        firmId: { type: string, format: uuid }
        clientCode: { type: string }
    LoginResult:
      type: object
      required: [token, expiresAt, account]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/SessionAccount" }
    CommandInput:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true }
    BusinessMaster:
      type: object
      required: [group, key, label, position, enabled, revision, metadata]
      properties:
        group: { type: string, maxLength: 64 }
        key: { type: string, maxLength: 160 }
        label: { type: string, maxLength: 240 }
        position: { type: integer, minimum: 0 }
        enabled: { type: boolean }
        revision: { type: integer, minimum: 1 }
        metadata: { type: object, additionalProperties: true }
    CommandResult:
      type: object
      required: [status]
      properties:
        status: { type: string }
        entity: { type: object, additionalProperties: true }
        access:
          type: object
          required: [mobile, reused]
          properties:
            mobile: { type: string }
            reused: { type: boolean }
            temporaryCredential: { type: string }
            expiresAt: { type: string, format: date-time }
        errors: { type: array, items: { type: string } }
    Firm:
      type: object
      required: [id, clientCode, name, status, revision, accountants]
      properties:
        id: { type: string, format: uuid }
        clientCode: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        revision: { type: integer }
        metadata:
          type: object
          properties:
            gstin: { type: string }
            panNumber: { type: string }
            reraNumber: { type: string }
            officeAddress: { type: string }
            proprietorPhone: { type: string }
            location: { type: string }
            state: { type: string }
        accountants:
          type: array
          items:
            type: object
            required: [identityId, displayName, mobile]
            properties:
              identityId: { type: string, format: uuid }
              displayName: { type: string }
              mobile: { type: string }
    Sector:
      type: object
      required: [id, code, name, enabled, releases]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        releases:
          type: array
          items:
            type: object
            required: [id, version, revision, state, label]
            properties:
              id: { type: string, format: uuid }
              version: { type: integer }
              revision: { type: integer }
              state: { type: string, enum: [DRAFT, PUBLISHED] }
              label: { type: string }
    Project:
      type: object
      required: [id, firmId, sectorId, name, status, revision, details, partners]
      properties:
        id: { type: string, format: uuid }
        firmId: { type: string, format: uuid }
        sectorId: { type: string, format: uuid }
        name: { type: string }
        location: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, COMPLETED, ARCHIVED] }
        revision: { type: integer }
        details: { type: object, additionalProperties: true }
        setupState: { type: string, enum: [DRAFT, READY] }
        setupData: { type: object, additionalProperties: true }
        partners:
          type: array
          items:
            type: object
            required: [identityId, displayName]
            properties:
              identityId: { type: string, format: uuid }
              displayName: { type: string }
              mobile: { type: string }
    ConfigField:
      type: object
      required: [key, label, kind, required, constraints, options]
      properties:
        key: { type: string }
        label: { type: string }
        kind: { type: string, enum: [text, number, date, select, boolean] }
        required: { type: boolean }
        constraints: { type: object, additionalProperties: true }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
    ConfigComponent:
      type: object
      required: [key, props, fields, actions]
      properties:
        key: { type: string, enum: [summary, project-list, project-form, partner-list, partner-form, erp-dashboard, erp-resource, erp-equity, erp-layout, erp-pricing, erp-statement, erp-audit, erp-settings, erp-plan] }
        props: { type: object, additionalProperties: true }
        fields: { type: array, items: { $ref: "#/components/schemas/ConfigField" } }
        actions:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
    SectorConfiguration:
      type: object
      required: [releaseId, sectorId, version, revision, state, label, interfaces, grants]
      properties:
        projectSetup: { type: object, additionalProperties: true }
        resources:
          type: array
          items: { type: object, additionalProperties: true }
        releaseId: { type: string, format: uuid }
        sectorId: { type: string, format: uuid }
        version: { type: integer }
        revision: { type: integer }
        state: { type: string, enum: [DRAFT, PUBLISHED] }
        label: { type: string }
        interfaces:
          type: array
          items:
            type: object
            required: [role, title, screens]
            properties:
              role: { type: string, enum: [ACCOUNTANT, PARTNER] }
              title: { type: string }
              screens:
                type: array
                items:
                  type: object
                  required: [key, label, components]
                  properties:
                    key: { type: string }
                    label: { type: string }
                    components: { type: array, items: { $ref: "#/components/schemas/ConfigComponent" } }
        grants:
          type: array
          items:
            type: object
            required: [role, permission, scope]
            properties:
              role: { type: string, enum: [ACCOUNTANT, PARTNER] }
              permission: { type: string }
              scope: { type: string, enum: [FIRM, MEMBER_PROJECTS] }
    Workspace:
      type: object
      required: [account, firms, sectors, projects, interfaces]
      properties:
        account: { $ref: "#/components/schemas/SessionAccount" }
        firms: { type: array, items: { $ref: "#/components/schemas/Firm" } }
        sectors: { type: array, items: { $ref: "#/components/schemas/Sector" } }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        interfaces:
          type: array
          items:
            type: object
            required: [firmId, sectorId, releaseId, sectorName, enabled, configuration]
            properties:
              firmId: { type: string, format: uuid }
              sectorId: { type: string, format: uuid }
              releaseId: { type: string, format: uuid }
              sectorName: { type: string }
              enabled: { type: boolean }
              configuration: { $ref: "#/components/schemas/SectorConfiguration" }
    ReadinessStatus:
      type: object
      required: [status, databaseReachable, targetVerified, reason]
      properties:
        status: { type: string }
        databaseReachable: { type: boolean }
        targetVerified: { type: boolean }
        reason: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

