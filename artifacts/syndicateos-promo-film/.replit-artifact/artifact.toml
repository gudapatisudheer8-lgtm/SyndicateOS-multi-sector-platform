kind = "video"
videoAspectRatio = "16:9"
previewPath = "/syndicateos-promo-film/"
title = "SyndicateOS — Application Tour"
description = "A narrated application tour of SyndicateOS open-plot ventures, accountant and partner dashboards, project finances, registration reminders, marketing invitations and illustrative 3D views, using demo data."
version = "1.0.0"
id = "artifacts/syndicateos-promo-film"
router = "path"

[[services]]
name = "web"
paths = [ "/syndicateos-promo-film/" ]
localPort = 19581

[services.development]
run = "pnpm --filter @workspace/syndicateos-promo-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syndicateos-promo-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/syndicateos-promo-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19581"
BASE_PATH = "/syndicateos-promo-film/"
